[workspace]
resolver = "2"
members = ["crates/core", "crates/media", "crates/service", "crates/gui"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["StoneSSSSSSS"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
crossbeam-channel = "0.5"
parking_lot = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tungstenite = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
windows = "0.58"
libloading = "0.8"
regex = "1"
once_cell = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
