[package]
name = "clipvault-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ClipVault desktop app: clips, 24/7 recordings, player with per-track audio mixing"
build = "build.rs"

[[bin]]
name = "clipvault"
path = "src/main.rs"

[dependencies]
clipvault-core = { path = "../core" }
clipvault-media = { path = "../media" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
image.workspace = true
once_cell.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "persistence"] }
glow = "0.17"
rfd = "0.15"

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Media_Audio",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Dwm",
]

[build-dependencies]
embed-resource = "2"

[dev-dependencies]
tempfile.workspace = true
